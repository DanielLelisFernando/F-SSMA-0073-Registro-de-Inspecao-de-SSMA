<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d68"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Inspeções SSMA"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Inspeções SSMA</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172a3a;background:#f3f6f9;--blue:#174e80;--light:#e5eff8;--line:#d7e0e8}*{box-sizing:border-box}body{margin:0;padding-bottom:env(safe-area-inset-bottom)}header{background:var(--blue);color:white;padding:18px 16px;position:sticky;top:0;z-index:2}header h1{font-size:20px;margin:0}header small{opacity:.85}main{max-width:900px;margin:auto;padding:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button,button{border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:white;font-weight:600;cursor:pointer}.tabs button.secondary,button.secondary{background:#e4edf5;color:#163c5d}.tabs button.active{background:#0b2742;color:white}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #193e5a0a}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd6df;border-radius:9px;padding:12px;font:inherit;background:white}textarea{min-height:84px}h2{font-size:18px}h3{font-size:16px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e6f1fa;color:#16476f;font-size:12px} .danger{background:#a42b35}.deviation{border:1px solid var(--line);padding:12px;border-radius:12px;margin:12px 0}.muted{color:#647789;font-size:13px}.hide{display:none}.signature{border:1px dashed #8ba3b8;border-radius:10px;touch-action:none;width:100%;height:170px;background:#fff}.footer{display:flex;gap:8px;flex-wrap:wrap}.footer button{flex:1}.photo{max-width:100%;max-height:200px;border-radius:8px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px}.list-item button{padding:8px}.alert{background:#fff5dd;border:1px solid #eed18a;border-radius:10px;padding:10px}.check{margin-right:8px} @media print{header,.tabs,button,.footer{display:none}body{background:white}}
</style></head><body><header><h1>Inspeções SSMA</h1><small>F-SSMA-0073 • Registro de Inspeção de SSMA</small></header><main>
<div class="tabs"><button id="tabNew" class="active" onclick="showTab('new')">Nova / Editar</button><button id="tabHistory" class="secondary" onclick="showTab('history')">Histórico</button></div>
<section id="newPanel"><div class="card"><div class="row"><div><label>Número</label><input id="number" readonly></div><div><label>Data</label><input id="date" type="date"></div></div><label>Responsável</label><input id="responsible"><label>Local</label><input id="location"><label>Participantes (um por linha)</label><textarea id="participants" placeholder="Nome do participante"></textarea><div id="participantSignatures"></div><label>Registro / matrícula do inspetor</label><input id="registration"><h3>Assinatura do inspetor</h3><canvas class="signature" id="inspectorSignature"></canvas><button class="secondary" onclick="clearSignature('inspectorSignature')">Limpar assinatura</button></div>
<div class="card"><div class="row"><h2>Desvios</h2><button onclick="addDeviation()">+ Adicionar desvio</button></div><div id="deviations"></div></div><div class="footer"><button onclick="saveInspection()">Salvar inspeção</button><button class="secondary" onclick="newInspection()">Nova / Limpar</button><button class="secondary" onclick="exportPDF()">Gerar relatório / PDF</button></div></section>
<section id="historyPanel" class="hide"><div class="card"><label>Pesquisar</label><input id="search" oninput="renderHistory()" placeholder="Número, responsável, local..."><div class="row"><div><label>De</label><input id="from" type="date" onchange="renderHistory()"></div><div><label>Até</label><input id="to" type="date" onchange="renderHistory()"></div></div><div class="row"><button onclick="selectAll()">Selecionar visíveis</button><button class="secondary" onclick="exportSelectedPDF()">PDF dos selecionados</button><button class="secondary" onclick="exportSelectedZIP()">ZIP selecionados</button><button onclick="backupAllZIP()">ZIP completo (evidências)</button></div></div><div id="historyList"></div></section>

</main><script src="app.js"></script></body></html>
