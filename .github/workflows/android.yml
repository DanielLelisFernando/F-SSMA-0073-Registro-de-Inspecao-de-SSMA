name: Android APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - name: Configure Android SDK
     run: |
      echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
   - uses: gradle/actions/setup-gradle@v3
   - name: Build APK
     run: gradle assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: ssma-inspecoes-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      retention-days: 30